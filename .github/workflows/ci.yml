name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PICO_SDK_VERSION: "2.3.1"

jobs:
  firmware:
    name: Firmware build (RP2040)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Always runs: the safety gate must never be skippable. Host-compiled, no SDK needed: unit tests of the pure
      # modules (crc32, frame, timing), the opcode gate (each opcode only through its own gate; NAND_CMD(0x80),
      # NAND_WCMD(0x85), non-constant opcodes, direct latch calls and write-path use outside nand_write.c rejected)
      # and the WP# guard (raised only in nand_bus_write_window_open).
      - name: Firmware host tests + opcode safety gate
        run: make -C firmware/tests check

      # Bounded: a stalled package mirror once hung this step for 12+ minutes. Retries + per-request timeout,
      # and the step itself gives up after 8 minutes.
      - name: Install ARM toolchain
        timeout-minutes: 8
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            cmake ninja-build build-essential pkg-config libusb-1.0-0-dev
          arm-none-eabi-gcc --version | head -1

      - name: Cache Pico SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-tinyusb

      - name: Fetch Pico SDK ${{ env.PICO_SDK_VERSION }}
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb

      # Release builds (tag vX.Y.Z): the firmware version comes from the tag. Other builds keep the CMakeLists default.
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          fi
          host=$(sed -n 's/^version = "\(.*\)"$/\1/p' host/pyproject.toml)
          if [ "$host" != "$version" ]; then
            echo "::warning::tag $GITHUB_REF_NAME, but host/pyproject.toml says version $host"
          fi
          echo "FW_VERSION=$version" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S firmware -B build -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -DPICO_BOARD=pico \
            -DCMAKE_BUILD_TYPE=Release ${FW_VERSION:+-DFW_VERSION="$FW_VERSION"}

      - name: Build
        run: cmake --build build --parallel

      - name: Check a .uf2 was produced
        run: |
          ls -l build/*.uf2
          test -n "$(ls build/*.uf2 2>/dev/null)"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: pico-nand-tool-uf2
          path: |
            build/*.uf2
            build/*.elf
            build/*.map
          if-no-files-found: error

  host:
    name: Host tool tests (latest Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"  # latest stable CPython

      - name: Install (venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e 'host[test]'

      - name: pytest
        run: .venv/bin/pytest host/tests -q

  # Tag vX.Y.Z: publish a GitHub release with the .uf2, once the firmware build and the host tests have passed.
  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, host]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write  # create the release; only this job gets write access
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pico-nand-tool-uf2
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp dist/pico_nand_tool.uf2 "pico_nand_tool-$TAG.uf2"
          gh release create "$TAG" "pico_nand_tool-$TAG.uf2" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "pico_nand_tool $TAG" --generate-notes
