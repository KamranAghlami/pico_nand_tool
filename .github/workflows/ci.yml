name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PICO_SDK_VERSION: "2.3.1"

jobs:
  firmware:
    name: Firmware build (RP2040)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Until firmware/ exists (pending design review) this job only reports and exits green.
      - name: Detect firmware sources
        id: detect
        run: |
          if [ -f firmware/CMakeLists.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::firmware/CMakeLists.txt not present yet - skipping firmware build"
          fi

      - name: Install ARM toolchain
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            cmake ninja-build build-essential pkg-config libusb-1.0-0-dev
          arm-none-eabi-gcc --version | head -1

      - name: Cache Pico SDK
        if: steps.detect.outputs.present == 'true'
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-tinyusb

      - name: Fetch Pico SDK ${{ env.PICO_SDK_VERSION }}
        if: steps.detect.outputs.present == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git pico-sdk
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb

      - name: Configure
        if: steps.detect.outputs.present == 'true'
        run: cmake -S firmware -B build -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -DPICO_BOARD=pico -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: cmake --build build --parallel

      - name: Check a .uf2 was produced
        if: steps.detect.outputs.present == 'true'
        run: |
          ls -l build/*.uf2
          test -n "$(ls build/*.uf2 2>/dev/null)"

      # Hard safety constraint: a forbidden opcode must be rejected at compile time.
      # The positive control proves the test file itself compiles, so the negative check can't pass by accident.
      - name: Safety gate - forbidden NAND opcode must not compile
        if: steps.detect.outputs.present == 'true' && hashFiles('firmware/tests/forbidden_opcode.c') != ''
        run: |
          set -u
          gcc -std=c11 -fsyntax-only -Ifirmware/src -DPOSITIVE_CONTROL firmware/tests/forbidden_opcode.c
          if gcc -std=c11 -fsyntax-only -Ifirmware/src firmware/tests/forbidden_opcode.c 2> gate.log; then
            echo "::error::forbidden_opcode.c compiled - the NAND opcode gate is broken"; exit 1
          fi
          cat gate.log
          grep -q "forbidden NAND opcode" gate.log

      - name: Host-compiled firmware unit tests
        if: steps.detect.outputs.present == 'true' && hashFiles('firmware/tests/test_crc_frame.c') != ''
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ifirmware/src \
            firmware/tests/test_crc_frame.c firmware/src/crc32.c -o test_crc_frame
          ./test_crc_frame

      - name: Upload firmware
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pico-nand-dumper-uf2
          path: |
            build/*.uf2
            build/*.elf
            build/*.map
          if-no-files-found: error

  host:
    name: Host tool tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Detect host package
        id: detect
        run: |
          if [ -f host/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::host/pyproject.toml not present yet - skipping host tests"
          fi

      - uses: actions/setup-python@v7
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: ${{ matrix.python }}

      - name: Install (venv)
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e 'host[test]'

      - name: pytest
        if: steps.detect.outputs.present == 'true'
        run: .venv/bin/pytest host/tests -q
