[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-nand-tool"
dynamic = ["version"]  # from nand_tool.__version__ (CI sets it from the release tag)
description = "Host tool for the Pico NAND Tool firmware (raw NAND dumper and writer)"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nandtool = "nand_tool.cli:main"

[tool.setuptools]
packages = ["nand_tool"]

[tool.setuptools.dynamic]
version = {attr = "nand_tool.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
